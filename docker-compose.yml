# External PostgreSQL (e.g. Neon): set DATABASE_URL in .env, then
#   docker compose up --build -d
# Local PostgreSQL in Docker instead: see docker-compose.local-db.yml.
services:
  # One-shot schema setup/upgrade; the app starts only after it succeeds. Safe to re-run.
  init-db:
    build: .
    image: competitor-research:latest
    command: ["python", "manage.py", "init-db", "--wait", "90"]
    # Least privilege: it needs only the database URL, not the API keys in .env.
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    restart: "no"

  app:
    build: .
    image: competitor-research:latest
    ports:
      - "${APP_PORT:-8501}:8501"
    # Credentials come from .env at runtime only (never copied into the image).
    env_file:
      - path: .env
        required: false
    volumes:
      - ./reports:/app/reports  # PDFs saved with "Save PDF to reports folder" appear here
    depends_on:
      init-db:
        condition: service_completed_successfully
    restart: unless-stopped
